<title>בדיקות אתרים סולאריים</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
:root{--bg:#f6f8f7;--card:#fff;--text:#17231c;--muted:#6b756f;--green:#1f6b45;--green2:#2d8b5d;--soft:#eaf4ee;--red:#b9382c;--redsoft:#fff0ee;--line:#e4e9e6;--shadow:0 12px 32px rgba(20,45,30,.10)}
*{box-sizing:border-box} html,body{height:100%;margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--text)} body{overflow:hidden}
button,input,textarea{font:inherit} button{cursor:pointer}
.app{height:100%;display:grid;grid-template-columns:330px 1fr;direction:ltr}
.sidebar{direction:rtl;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:800;box-shadow:0 0 24px rgba(0,0,0,.04)}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)} .brand h1{font-size:23px;margin:0 0 4px} .brand p{margin:0 0 14px;color:var(--muted);font-size:13px}
.search{width:100%;border:1px solid #d8dfdb;background:#fbfcfb;border-radius:12px;padding:12px 13px;outline:none} .search:focus{border-color:#85b99b;box-shadow:0 0 0 3px rgba(45,139,93,.10)}
.count{font-size:12px;color:var(--muted);margin-top:9px} .list{padding:8px;overflow:auto}
.site{padding:12px 12px;border-radius:12px;margin-bottom:5px;border:1px solid transparent;cursor:pointer;transition:.15s} .site:hover{background:#f4f8f5} .site.active{background:var(--soft);border-color:#cde1d4}
.site-name{font-weight:900;font-size:15px;color:#17683f} .site.active .site-name{color:#fff;background:linear-gradient(135deg,#1f6b45,#35a36d);display:inline-block;padding:5px 10px;border-radius:9px} .site-details{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#map{height:100%;width:100%;direction:ltr} .leaflet-popup-content-wrapper{border-radius:12px}
.mobile-menu{display:none;position:absolute;top:14px;right:14px;z-index:1000;border:0;background:#fff;border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(13,24,17,.46);z-index:2000;display:none;padding:20px;overflow:auto} .overlay.open{display:block}
.panel{max-width:860px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;background:#fff;border-bottom:1px solid var(--line)}
.panel-title{margin:0;font-size:24px;color:#fff;background:linear-gradient(135deg,#17683f,#35a36d);display:inline-block;padding:8px 14px;border-radius:12px;box-shadow:0 5px 14px rgba(31,107,69,.20)} .panel-sub{font-size:13px;color:var(--muted);margin-top:6px} .close{width:40px;height:40px;border:0;border-radius:12px;background:#f1f4f2;font-size:24px;line-height:1}
.notice{display:none;margin:14px 18px 0;padding:12px 14px;border-radius:12px;background:var(--redsoft);color:#8f2a22;border:1px solid #f1c5c1;font-weight:700;font-size:14px} .notice.show{display:block}
.content{padding:16px 18px 10px} .check-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:#fff}
.check-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap} .check-title{font-weight:800;font-size:16px}
.statuses{display:flex;gap:8px} .status{border:1px solid #d6ddd9;background:#fff;border-radius:10px;padding:8px 12px;font-weight:800} .status.ok.on{background:#eaf7ef;color:#17683f;border-color:#a9d5ba} .status.bad.on{background:var(--redsoft);color:var(--red);border-color:#e9aaa4}
.note{width:100%;min-height:70px;resize:vertical;margin-top:12px;border:1px solid #d8dfdb;border-radius:11px;padding:10px;outline:none} .note:focus{border-color:#8bbda0}
.photo-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px} .photo-btn{display:inline-flex;align-items:center;gap:6px;background:#f1f6f3;color:#225c3f;border:1px solid #d4e5da;border-radius:10px;padding:8px 11px;font-weight:800} .photo-input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap} .thumb{position:relative;width:70px;height:70px} .thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)} .thumb button{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border:0;border-radius:50%;background:#a92f25;color:#fff}
.extra{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px} .extra textarea{width:100%;min-height:105px;margin-top:9px;border:1px solid #d8dfdb;border-radius:11px;padding:10px;resize:vertical}
.footer{position:sticky;bottom:0;z-index:4;background:#fff;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap} .primary{border:0;background:var(--green2);color:#fff;border-radius:11px;padding:11px 15px;font-weight:800} .secondary{border:0;background:#edf4f0;color:#245d41;border-radius:11px;padding:11px 15px;font-weight:800} .danger{border:1px solid #efc5c1;background:#fff;color:#9c2e26;border-radius:11px;padding:10px 14px;font-weight:800} .finish{margin-inline-start:auto;border:0;background:linear-gradient(135deg,#173d2b,#287553);color:#fff;border-radius:11px;padding:12px 22px;font-weight:900;font-size:16px;box-shadow:0 5px 14px rgba(23,61,43,.20)} .state{font-size:12px;color:var(--muted)}
@media(max-width:800px){.app{display:block;position:relative} .sidebar{position:absolute;top:0;right:0;height:100%;width:min(86vw,330px);transform:translateX(105%);transition:.22s} .sidebar.open{transform:translateX(0)} .mobile-menu{display:block} #map{height:100vh} .overlay{padding:0} .panel{min-height:100vh;border-radius:0} .panel-head{padding:14px 14px} .panel-title{font-size:21px} .content{padding:12px} .footer{padding:12px} .check-top{align-items:flex-start} .statuses{width:100%} .status{flex:1;padding:10px}}
.inspection-date-label{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700;color:#245d41}.inspection-date-label input{font:inherit;padding:8px;border:1px solid #d8dfdb;border-radius:9px;max-width:175px;background:white;color:#17231c}.water-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.water-fields label{font-weight:700;font-size:14px}.water-fields input{display:block;width:100%;padding:12px;border:1px solid #d8dfdb;border-radius:10px;margin-top:7px;direction:rtl}@media(max-width:450px){.water-fields{grid-template-columns:1fr}}
</style>

  </section>
</div>

function save(show=true){if(!currentSite)return;currentData.inspectionDate=document.getElementById('inspectionDate').value;currentData.extraNotes=document.getElementById('extraNotes').value;currentData.waterMeter=document.getElementById('waterMeter').value;currentData.waterReading=document.getElementById('waterReading').value;currentData.waterTime=document.getElementById('waterTime').value;currentData.backflowExpiry=document.getElementById('backflowExpiry').value;currentData.savedAt=new Date().toISOString();currentData.reportPrepared=reportPrepared;try{localStorage.setItem(key(currentSite.name),JSON.stringify(currentData));dirty=false;if(show)document.getElementById('state').textContent='נשמר'}catch(e){alert('לא ניתן לשמור עוד תמונות בדפדפן. נסה למחוק תמונות ישנות.')}updateNotice()}

function b64(str){const u=new TextEncoder().encode(str);let b='';u.forEach(x=>b+=String.fromCharCode(x));return btoa(b)}
function prepareMail(){if(!currentSite)return;save(false);const subject=`דוח בדיקת אתר - ${currentSite.name}`;const boundary='----Solar_'+Date.now();let eml=`To: ${REPORT_TO}
Subject: =?UTF-8?B?${b64(subject)}?=

Content-Type: multipart/mixed; boundary="${boundary}"

--${boundary}
Content-Type: text/plain; charset=UTF-8
Content-Transfer-Encoding: base64

${b64(reportText())}
`;let n=1;currentData.items.forEach((x,i)=>{if(x.status==='bad'||(x.note||'').trim())(x.photos||[]).forEach(p=>{const raw=p.data.split(',')[1]||'';eml+=`--${boundary}
Content-Type: image/jpeg; name="site_${i+1}_${n}.jpg"
Content-Disposition: attachment; filename="site_${i+1}_${n}.jpg"

${raw}
`;n++})});eml+=`--${boundary}--
